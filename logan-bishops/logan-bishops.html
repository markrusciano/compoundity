<html lang="en">
<head>

<title>Logan Bishops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Mochiy+Pop+One&family=Pacifico&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* base styles only; ui.js injects the Vine app chrome styles */
  html, body { margin: 0; padding: 0; background: #e9ecea; color: #222; }
  body { font-family: 'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .lb-stage { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #0e1a33; user-select: none; -webkit-user-select: none; }
  .lb-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lb-stage-only-mode, .lb-stage-only-mode body { background: #000; }
  .lb-stage-only { width: min(100vw, 100vh); }
  .lb-debug { position: fixed; left: 8px; bottom: 8px; z-index: 99; font: 600 14px/1 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.7); color: #0f0; padding: 6px 8px; border-radius: 4px; }
</style>

<body>
<div id="app"></div>
<!-- order matters: core first, main last. tools/build.cjs inlines every local script below into one file. -->
<script>/* core.js */
/* Logan Bishops: shared core (namespace, SVG helpers, easing, keyframes, loop clock, stage). */
(function () {
  'use strict';
  var LB = (window.LB = window.LB || {});
  var NS = (LB.NS = 'http://www.w3.org/2000/svg');

  LB.D = 6.0; // loop duration in seconds; the director may change it via LB.setDuration
  LB.setDuration = function (d) { LB.D = d; };

  // ---------------------------------------------------------------- SVG helpers
  LB.attr = function (node, attrs) {
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === undefined || v === null) continue;
      if (k === 'text') node.textContent = v;
      else node.setAttribute(k, v);
    }
    return node;
  };
  LB.el = function (tag, attrs, parent) {
    var n = LB.attr(document.createElementNS(NS, tag), attrs);
    if (parent) parent.appendChild(n);
    return n;
  };
  LB.g = function (parent, attrs) { return LB.el('g', attrs, parent); };
  LB.path = function (parent, d, attrs) {
    var a = attrs || {};
    a.d = d;
    return LB.el('path', a, parent);
  };
  var uidN = 0;
  LB.uid = function (prefix) { return (prefix || 'lb') + '-' + (++uidN); };
  LB.defs = function (svg) {
    var d = svg.querySelector(':scope > defs');
    if (!d) { d = LB.el('defs'); svg.insertBefore(d, svg.firstChild); }
    return d;
  };
  // transform string helper: LB.tf({x, y, rot, sx, sy, s, ox, oy}) rotates/scales about (ox, oy) after translating.
  LB.tf = function (o) {
    var x = o.x || 0, y = o.y || 0, r = o.rot || 0;
    var sx = o.sx != null ? o.sx : (o.s != null ? o.s : 1);
    var sy = o.sy != null ? o.sy : (o.s != null ? o.s : 1);
    var ox = o.ox || 0, oy = o.oy || 0;
    var s = 'translate(' + r4(x) + ' ' + r4(y) + ')';
    if (ox || oy) s += ' translate(' + r4(ox) + ' ' + r4(oy) + ')';
    if (r) s += ' rotate(' + r4(r) + ')';
    if (sx !== 1 || sy !== 1) s += ' scale(' + r4(sx) + ' ' + r4(sy) + ')';
    if (ox || oy) s += ' translate(' + r4(-ox) + ' ' + r4(-oy) + ')';
    return s;
  };
  function r4(v) { return Math.round(v * 1e4) / 1e4; }
  LB.r4 = r4;
  // show/hide without layout churn
  LB.show = function (node, on) { node.style.display = on ? '' : 'none'; };
  LB.opacity = function (node, k) { node.setAttribute('opacity', r4(LB.clamp(k, 0, 1))); };

  // ---------------------------------------------------------------- math
  LB.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  LB.lerp = function (a, b, k) { return a + (b - a) * k; };
  LB.invLerp = function (a, b, v) { return a === b ? 0 : (v - a) / (b - a); };
  LB.remap = function (v, a, b, c, d) { return LB.lerp(c, d, LB.clamp(LB.invLerp(a, b, v), 0, 1)); };
  LB.smoothstep = function (a, b, v) { var k = LB.clamp(LB.invLerp(a, b, v), 0, 1); return k * k * (3 - 2 * k); };
  LB.deg = Math.PI / 180;

  function hex(c) {
    c = c.replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)];
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (v) { var s = Math.round(LB.clamp(v, 0, 255)).toString(16); return s.length < 2 ? '0' + s : s; }).join('');
  }
  LB.lerpColor = function (a, b, k) {
    var A = hex(a), B = hex(b);
    return toHex([LB.lerp(A[0], B[0], k), LB.lerp(A[1], B[1], k), LB.lerp(A[2], B[2], k)]);
  };
  LB.shade = function (c, k) { return k < 0 ? LB.lerpColor(c, '#000000', -k) : LB.lerpColor(c, '#ffffff', k); };

  // ---------------------------------------------------------------- easing
  var E = (LB.ease = {
    linear: function (k) { return k; },
    step: function (k) { return k < 1 ? 0 : 1; },
    hold: function () { return 0; },
    inQuad: function (k) { return k * k; },
    outQuad: function (k) { return k * (2 - k); },
    inOutQuad: function (k) { return k < 0.5 ? 2 * k * k : -1 + (4 - 2 * k) * k; },
    inCubic: function (k) { return k * k * k; },
    outCubic: function (k) { return --k * k * k + 1; },
    inOutCubic: function (k) { return k < 0.5 ? 4 * k * k * k : (k - 1) * (2 * k - 2) * (2 * k - 2) + 1; },
    inQuart: function (k) { return k * k * k * k; },
    outQuart: function (k) { return 1 - --k * k * k * k; },
    inOutSine: function (k) { return -(Math.cos(Math.PI * k) - 1) / 2; },
    outExpo: function (k) { return k === 1 ? 1 : 1 - Math.pow(2, -10 * k); },
    inExpo: function (k) { return k === 0 ? 0 : Math.pow(2, 10 * k - 10); },
    outBack: function (k) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
    inBack: function (k) { var c1 = 1.70158, c3 = c1 + 1; return c3 * k * k * k - c1 * k * k; },
    outElastic: function (k) {
      if (k === 0 || k === 1) return k;
      return Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
    },
    outBounce: function (k) {
      var n1 = 7.5625, d1 = 2.75;
      if (k < 1 / d1) return n1 * k * k;
      if (k < 2 / d1) return n1 * (k -= 1.5 / d1) * k + 0.75;
      if (k < 2.5 / d1) return n1 * (k -= 2.25 / d1) * k + 0.9375;
      return n1 * (k -= 2.625 / d1) * k + 0.984375;
    },
    // anime "snap": almost all of the motion happens in the first 25%
    snap: function (k) { return 1 - Math.pow(1 - LB.clamp(k, 0, 1), 6); },
  });

  // ---------------------------------------------------------------- keyframe tracks
  // LB.track([[t, value, easeIntoThisKey?], ...]) -> function (t) -> value
  //   numbers interpolate; '#rrggbb' strings interpolate as colors; other strings / booleans hold (step);
  //   plain objects interpolate field by field with the same rules.
  // The ease on a key shapes the segment that ENDS at that key (default 'inOutCubic').
  LB.track = function (keys) {
    keys = keys.slice().sort(function (a, b) { return a[0] - b[0]; });
    return function (t) {
      if (t <= keys[0][0]) return keys[0][1];
      var last = keys[keys.length - 1];
      if (t >= last[0]) return last[1];
      for (var i = 1; i < keys.length; i++) {
        if (t < keys[i][0]) {
          var a = keys[i - 1], b = keys[i];
          var ez = E[b[2] || 'inOutCubic'] || E.inOutCubic;
          return LB.mixValue(a[1], b[1], ez(LB.invLerp(a[0], b[0], t)));
        }
      }
      return last[1];
    };
  };
  LB.mixValue = function (a, b, k) {
    if (typeof a === 'number' && typeof b === 'number') return LB.lerp(a, b, k);
    if (typeof a === 'string' && typeof b === 'string' && a[0] === '#' && b[0] === '#') return LB.lerpColor(a, b, k);
    if (a && b && typeof a === 'object' && typeof b === 'object') {
      var o = {}, key;
      for (key in a) o[key] = key in b ? LB.mixValue(a[key], b[key], k) : a[key];
      for (key in b) if (!(key in a)) o[key] = b[key];
      return o;
    }
    return k < 1 ? a : b;
  };
  // envelope: 0 before a, ramps up over fadeIn, 1 until b, ramps down over fadeOut
  LB.env = function (t, a, b, fadeIn, fadeOut) {
    fadeIn = fadeIn || 0; fadeOut = fadeOut || 0;
    if (t < a || t > b + fadeOut) return 0;
    if (fadeIn && t < a + fadeIn) return (t - a) / fadeIn;
    if (t <= b) return 1;
    return fadeOut ? 1 - (t - b) / fadeOut : 0;
  };
  // progress 0..1 of t inside [a, b], clamped
  LB.prog = function (t, a, b) { return LB.clamp(LB.invLerp(a, b, t), 0, 1); };
  LB.inWin = function (t, a, b) { return t >= a && t < b; };
  // loop-safe periodic motion: `cycles` must be an integer number of cycles per loop to stay seamless
  LB.loopSin = function (t, cycles, phase) { return Math.sin(2 * Math.PI * ((cycles || 1) * t / LB.D + (phase || 0))); };

  // ---------------------------------------------------------------- deterministic noise
  LB.hash = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
  LB.noise1 = function (x, seed) {
    seed = seed || 0;
    var i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return LB.lerp(LB.hash(i + seed * 57.3), LB.hash(i + 1 + seed * 57.3), u) * 2 - 1;
  };
  // deterministic camera shake offset; amp in world units, freq in Hz
  LB.shake = function (t, amp, freq, seed) {
    if (!amp) return { x: 0, y: 0, rot: 0 };
    var f = (freq || 24) * t;
    return { x: LB.noise1(f, seed || 1) * amp, y: LB.noise1(f, (seed || 1) + 9) * amp, rot: LB.noise1(f, (seed || 1) + 17) * amp * 0.08 };
  };
  // seeded PRNG for building static geometry (stars, ermine spots, speckles) identically every load
  LB.rng = function (seed) {
    var s = seed >>> 0 || 1;
    return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };

  // ---------------------------------------------------------------- loop clock
  var clock = (LB.clock = {
    t: 0, loops: 0, paused: false, rate: 1,
    _last: null, _listeners: [],
    tick: function (now) {
      if (clock._last === null) clock._last = now;
      var dt = Math.min(0.1, (now - clock._last) / 1000);
      clock._last = now;
      if (!clock.paused) {
        clock.t += dt * clock.rate;
        while (clock.t >= LB.D) {
          clock.t -= LB.D;
          clock.loops++;
          for (var i = 0; i < clock._listeners.length; i++) clock._listeners[i](clock.loops);
        }
      }
      return clock.t;
    },
    seek: function (t) { clock.t = ((t % LB.D) + LB.D) % LB.D; LB.renderNow && LB.renderNow(); },
    pause: function () { clock.paused = true; },
    play: function () { clock.paused = false; clock._last = null; },
    onLoop: function (fn) { clock._listeners.push(fn); },
  });
  LB.seek = clock.seek;
  LB.pause = clock.pause;
  LB.play = clock.play;

  // ---------------------------------------------------------------- stage
  // Two stacked square SVGs, both viewBox 0 0 1000 1000:
  //   world   : everything the camera sees. <g camera> holds layers bg, mid, chars, fxWorld.
  //   overlay : screen-space effects and text (not affected by camera or by world filters).
  LB.mountStage = function (container) {
    container.classList.add('lb-stage');
    var mk = function (cls) {
      var s = LB.el('svg', { viewBox: '0 0 1000 1000', preserveAspectRatio: 'xMidYMid slice', class: cls });
      s.setAttribute('xmlns', NS);
      container.appendChild(s);
      return s;
    };
    var world = mk('lb-world');
    var camera = LB.g(world, { class: 'lb-camera' });
    var overlay = mk('lb-overlay');
    var stage = {
      root: container,
      world: world,
      camera: camera,
      overlay: overlay,
      layers: {
        bg: LB.g(camera, { class: 'lb-bg' }),
        mid: LB.g(camera, { class: 'lb-mid' }),
        chars: LB.g(camera, { class: 'lb-chars' }),
        fg: LB.g(camera, { class: 'lb-fg' }),
        fxWorld: LB.g(camera, { class: 'lb-fxworld' }),
        fxScreen: LB.g(overlay, { class: 'lb-fxscreen' }),
        text: LB.g(overlay, { class: 'lb-text' }),
      },
      defsWorld: LB.defs(world),
      defsOverlay: LB.defs(overlay),
    };
    return stage;
  };
  LB.reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  LB.applyCamera = function (stage, cam, t) {
    cam = cam || {};
    var zoom = cam.zoom || 1, x = cam.x != null ? cam.x : 500, y = cam.y != null ? cam.y : 500;
    var sh = LB.shake(t, (cam.shake || 0) * (LB.reducedMotion ? 0.4 : 1), cam.shakeFreq || 24, 3);
    var rot = (cam.rot || 0) + sh.rot;
    stage.cam = { x: x, y: y, zoom: zoom, rot: rot, sx: 500 + sh.x, sy: 500 + sh.y };
    stage.camera.setAttribute('transform',
      'translate(' + r4(500 + sh.x) + ' ' + r4(500 + sh.y) + ') rotate(' + r4(rot) + ') scale(' + r4(zoom) + ') translate(' + r4(-x) + ' ' + r4(-y) + ')');
    stage.world.style.filter = cam.filter || '';
  };
  // world point -> screen point (overlay viewBox units, 0..1000) for the camera applied this frame
  LB.worldToScreen = function (stage, p) {
    var c = stage.cam || { x: 500, y: 500, zoom: 1, rot: 0, sx: 500, sy: 500 };
    var dx = (p.x - c.x) * c.zoom, dy = (p.y - c.y) * c.zoom, a = c.rot * LB.deg;
    return { x: c.sx + dx * Math.cos(a) - dy * Math.sin(a), y: c.sy + dx * Math.sin(a) + dy * Math.cos(a) };
  };

  // Silhouette mode for impact frames: LB.silhouette(root, on, color) paints every shape in `root` one flat color.
  // Mark decorative bits that should vanish in silhouette (highlights, glows) with data-sil="hide".
  (function injectCss() {
    var css = '.lb-sil, .lb-sil * { fill: var(--lb-sil, #000) !important; stroke: var(--lb-sil, #000) !important; }' +
      '.lb-sil [fill="none"] { fill: none !important; }' +
      '.lb-sil [stroke="none"] { stroke: none !important; }' +
      '.lb-sil [data-sil="hide"] { display: none !important; }';
    var s = document.createElement('style');
    s.textContent = css;
    (document.head || document.documentElement).appendChild(s);
  })();
  LB.silhouette = function (root, on, color) {
    if (on) { root.classList.add('lb-sil'); root.style.setProperty('--lb-sil', color || '#000'); }
    else root.classList.remove('lb-sil');
  };

  // resolve a position given as {x, y} (world) or as an anchor ref string 'who.name' (e.g. 'friar.lensR')
  LB.resolveAt = function (ctx, at) {
    if (!at) return { x: 500, y: 500 };
    if (typeof at === 'string') { var p = at.split('.'); return ctx.anchor(p[0], p[1]); }
    return at;
  };
  // fixed world points from the storyboard that several modules need
  LB.WORLD = { arches: { x: 590, y: 225 }, billboard: { x: 515, y: 195 }, floorY: 950 };
  // limited animation helper: quantize time to 12 fps ("on twos")
  LB.onTwos = function (t) { return Math.floor(t * 12 + 1e-6) / 12; };
  // world-space position of an element's local point (pre-camera), for anchors
  LB.worldPoint = function (stage, node, px, py) {
    var m = stage.layers.chars.getCTM().inverse().multiply(node.getCTM());
    return { x: m.a * (px || 0) + m.c * (py || 0) + m.e, y: m.b * (px || 0) + m.d * (py || 0) + m.f };
  };

  // module registry (each src file calls LB.register('name', impl))
  LB.mod = {};
  LB.register = function (name, impl) { LB.mod[name] = impl; return impl; };
})();

</script>
<script>/* face.js */
/* Logan Bishops: shared anime face kit (LB.face) and style constants (LB.style).
 * Owned by the lead character designer. See docs/STYLE.md for how to use it. */
(function () {
  'use strict';
  var LB = window.LB;

  function n2(v) { return Math.round(v * 100) / 100; }
  function pt(p) { return n2(p[0]) + ' ' + n2(p[1]); }
  function lerp(a, b, k) { return a + (b - a) * k; }

  // ------------------------------------------------------------------ style bible constants
  var S = (LB.style = {
    // ink
    line: '#2A1B16',        // main outline: warm near-black
    lineSoft: '#6A4333',    // soft interior lines on skin (lid crease, lip shadow)
    lineCloth: '#3A2620',   // fold and seam lines on fabric
    lw: { outer: 2.4, inner: 1.7, detail: 1.1, fine: 0.75 },
    // light: key light is the globe lamp, upper-left. Shadows fall on the lower-right of every form.
    light: { x: -0.6, y: -0.8 },
    shadowDir: { x: 0.6, y: 0.8 },
    // eyes and face
    eyeWhite: '#FCFAF6', eyeShade: '#D9CFE2', catchlight: '#FFFFFF',
    crease: '#9C6650',
    mouthIn: '#5A1E28', tongue: '#C65662', lipShadow: '#B97563',
    sweat: '#CDEEFF', sweatShade: '#93CBEF', sweatLine: '#3A76AC',
    blush: '#EF8C93', blushLine: '#D9606E',
    skin: '#F2C9AE', skinShadow: '#DBA185',
    palette: {
      king: {
        skin: '#F2C9AE', skinShadow: '#DBA185', lip: '#D98C84',
        hair: '#6B4A33', hairShadow: '#46301F', hairShine: '#94704F',
        iris: '#7A5536', irisDark: '#3E2918', irisLight: '#B98E5E',
        brow: '#4A3122', mustache: '#6B4A33', mustacheShadow: '#46301F',
        cape: '#B3141C', capeShadow: '#6E0A10', capeSheen: '#D8262C', lining: '#8E0E16', liningShadow: '#5E070D',
        ermine: '#F4F1EA', ermineShadow: '#CFC6B8', ermineSpot: '#141414',
        crown: '#A0121A', crownShadow: '#650A10', crownSheen: '#CC2A32',
        gold: '#E3B23C', goldShadow: '#A8781E', goldHi: '#FFF1B0', goldLine: '#5E3F0C',
        jewelBlue: '#2C5BD0', jewelGreen: '#14936A', jewelRed: '#D3263A',
        jacket: '#B9A07A', jacketShadow: '#8C7551', jacketSeam: '#6F5A3C',
        tee: '#6B4A36', teeShadow: '#4B3223', teePrint: '#E9A35A',
        jeans: '#2B3448', jeansShadow: '#1A2030', jeansFade: '#36415B', cuff: '#4A5878', stitch: '#C98A3C', selvedge: '#EDE7DA',
        sock: '#232328', sockShadow: '#101013', sockHi: '#4A4A55',
        shaft: '#141414', shaftHi: '#55555C', knob: '#E8B530', knobShadow: '#A8781E', knobHi: '#FFF6C8',
        ring: '#C9CDD3', cord: '#C0121C',
      },
      friar: {
        skin: '#F2C9AE', skinShadow: '#DBA185', lip: '#D88A82',
        hair: '#5A4030', hairShadow: '#3B291E', hairShine: '#7E5E48',
        beard: '#5A4030', beardShadow: '#3B291E',
        iris: '#5D7486', irisDark: '#2F3E4C', irisLight: '#93AABB', brow: '#3F2C21',
        robe: '#C9A27E', robeShadow: '#9E7656', robeMottle: '#DDBB97',
        tee: '#1C1C1F', teeShadow: '#0C0C0E',
        lens: '#EAF3F8', lensShine: '#FFFFFF', frame: '#B8BCC2',
        sock: '#8C8C8C', sockShadow: '#696969',
      },
      bishop: {
        skin: '#F2C7AC', skinShadow: '#DA9F84', lip: '#D88A82',
        hair: '#8A4E2E', hairShadow: '#5E321B', hairShine: '#B07148',
        mustache: '#8A4E2E', mustacheShadow: '#5E321B',
        iris: '#5A86A6', irisDark: '#2C4A62', irisLight: '#9CC2DA', brow: '#6E3C22',
        mitre: '#F3EEDC', mitreShadow: '#CFC4A6', mitreGold: '#D4A84A', mitreGoldShadow: '#9E7728',
        satin: '#C8161E', satinShadow: '#7A0A10', satinHi: '#F2666C',
        stole: '#D9B25B', stoleShadow: '#A7823A', collar: '#F7F5EE', collarShadow: '#D2CDC0',
        pants: '#3A3B40', pantsShadow: '#25262A', sock: '#8C8C8C', sockShadow: '#686868', sockKnit: '#A8A8A8',
        slide: '#23304A', slideShadow: '#141C2D',
      },
    },
  });

  // ------------------------------------------------------------------ geometry helpers
  // Catmull-Rom spline through points -> cubic Bezier segments (string without the leading M).
  function crSeg(P, closed) {
    var n = P.length, s = '', i, last = closed ? n : n - 1;
    function at(k) { return closed ? P[(k + n) % n] : P[Math.max(0, Math.min(n - 1, k))]; }
    for (i = 0; i < last; i++) {
      var p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
      var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      var c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      s += 'C' + pt(c1) + ' ' + pt(c2) + ' ' + pt(p2);
    }
    return s;
  }
  // smooth path through points
  function crD(P, closed) { return 'M' + pt(P[0]) + crSeg(P, closed) + (closed ? 'Z' : ''); }

    }

  }

  LB.register('bishop', { create: create });
})();

/* Logan Bishops: scene painter.
 * The Logan Square apartment at night, painted as an anime background.
 *   bg  : room shell, night windows with the city, the OVER $1 BILLION RECOVERED billboard, the golden arches,
 *         the globe lamp, the dracaena, the blond wood floor.

 *         cat bottle, coffee shelf, "Peanut Day" box), then the state layers: shoujo bokeh, villain panel, impact flat.
 * All DOM is built once in create(); update() only sets attributes. Every visual is a pure function of (state, t). */

  'use strict';

    r = Math.min(r, w / 2, h / 2);

    P(bg, ellD(1330, 572, 3.6), { fill: '#C8FFE4' });

      var hi = P(gN, 'M' + pt(-b[2] * 0.62, -b[2] * 0.22) + 'A' + f(b[2] * 0.66) + ' ' + f(b[2] * 0.66) + ' 0 0 1 ' + pt(-b[2] * 0.2, -b[2] * 0.62),
        { fill: 'none', stroke: '#FFFFFF', 'stroke-width': Math.max(1.4, b[2] * 0.09), 'stroke-linecap': 'round' });
      if (disc) LB.show(hi, false);
      return { x: b[0], y: b[1], r: b[2], g: gN, c: circ, hi: hi, d: LB.hash(i * 3.1 + 1), d2: LB.hash(i * 7.7 + 5), ph: LB.hash(i * 1.3 + 9) };
    });

    var panelG = G(mid, {});
    LB.show(panelG, false);
    var PC = { x: 500, y: 330 };
    var panelBase = P(panelG, rectD(-2600, -2600, 6400, 6400), { fill: radU(PC.x, PC.y, 250, [[0, '#4A1D6E'], [0.2, '#3A1758'], [0.62, '#220A3C'], [1, '#12061F']]) });
    var panelAura = P(panelG, ellD(PC.x, PC.y - 6, 150), { fill: radB([[0, '#9B45D8', 0.5], [0.5, '#6E2AA8', 0.18], [1, '#6E2AA8', 0]]) });
    var linesG = G(panelG, {}), linesDk, linesLt;
    (function () {
      var r = LB.rng(91), dk = '', lt = '', i, a, w, r0, r1 = 1900;
      function wedge(a, w, r0) {
        var c = Math.cos(a * LB.deg), s = Math.sin(a * LB.deg);
        var ca = Math.cos((a - w) * LB.deg), sa = Math.sin((a - w) * LB.deg), cb = Math.cos((a + w) * LB.deg), sb = Math.sin((a + w) * LB.deg);
        return polyD([[PC.x + c * r0, PC.y + s * r0], [PC.x + ca * r1, PC.y + sa * r1], [PC.x + cb * r1, PC.y + sb * r1]]);
      }
      for (i = 0; i < 96; i++) { a = i / 96 * 360 + r() * 2.5; w = 0.35 + r() * 1.1; r0 = 40 + r() * 70; dk += wedge(a, w, r0); }
      for (i = 0; i < 36; i++) { a = (i + 0.5) / 36 * 360 + r() * 4; w = 0.15 + r() * 0.35; r0 = 70 + r() * 80; lt += wedge(a, w, r0); }
      linesDk = P(linesG, dk, { fill: '#07020D', 'fill-opacity': 0.6 });
      linesLt = P(linesG, lt, { fill: '#8A4BC2', 'fill-opacity': 0.2 });
    })();
    var panelVig = P(panelG, rectD(-2600, -2600, 6400, 6400), { fill: radU(PC.x, PC.y, 215, [[0, '#050009', 0], [0.48, '#050009', 0], [0.8, '#050009', 0.5], [1, '#050009', 0.88]]) });

    var impactR = P(mid, rectD(-3000, -3000, 7000, 7000), { fill: '#C8161E' });
    LB.show(impactR, false);

    // ================================================================ update (attributes only, cached)
    var cache = {};
    function setA(node, key, name, val) { if (cache[key] !== val) { cache[key] = val; node.setAttribute(name, val); } }
    function vis(node, key, on) { if (cache[key] !== on) { cache[key] = on; LB.show(node, on); } }

    return {
      update: function (s, t) {
        s = s || {};
        t = num(t, 0);

        // impact: flat red over the whole room, under the characters
        var imp = LB.clamp(num(s.impact, 0), 0, 1);
        vis(impactR, 'imp', imp > 0.001);
        if (imp > 0.001) setA(impactR, 'impO', 'fill-opacity', r3(imp));

        // villain panel
        var pk = s.panel === 'villain' ? LB.clamp(num(s.panelK, 1), 0, 1) : 0;
        vis(panelG, 'pan', pk > 0.001);
        if (pk > 0.001) {
          setA(panelBase, 'pb', 'fill-opacity', r3(pk));
          setA(panelAura, 'pa', 'fill-opacity', r3(pk * (0.85 + 0.15 * LB.loopSin(t, 6))));
          setA(panelVig, 'pv', 'fill-opacity', r3(pk));
          setA(linesDk, 'pl', 'fill-opacity', r3(0.6 * pk));
          setA(linesLt, 'pl2', 'fill-opacity', r3(0.2 * pk));
          setA(linesG, 'plr', 'transform', 'rotate(' + r3(t * (LB.reducedMotion ? 1.5 : 5)) + ' ' + PC.x + ' ' + PC.y + ')');
        }

        // shoujo bokeh: bloom in with stagger, drift up, then pop out as breaking rings
        var bk = LB.clamp(num(s.bokeh, 0), 0, 1), pop = LB.clamp(num(s.bokehPop, 0), 0, 1);
        var bOn = bk > 0.001 && pop < 0.999;
        vis(bokehG, 'bok', bOn);
        if (bOn) {
          var drift = LB.reducedMotion ? 0.3 : 1;
          bubbles.forEach(function (b, i) {
            var k = LB.clamp((bk - b.d * 0.4) / 0.6, 0, 1);
            var pi = LB.clamp((pop - b.d2 * 0.35) / 0.65, 0, 1);
            var sc = (0.35 + 0.65 * LB.ease.outBack(k)) * (1 + 0.55 * LB.ease.outCubic(pi));
            var x = b.x + 6 * drift * LB.loopSin(t, 3, b.ph);
            var y = b.y - drift * (14 * t + 5 * LB.loopSin(t, 6, b.ph + 0.25));
            setA(b.g, 'bt' + i, 'transform', 'translate(' + r3(x) + ' ' + r3(y) + ') scale(' + r3(Math.max(0.001, sc)) + ')');
            var body = k * (1 - pi);
            setA(b.c, 'bf' + i, 'fill-opacity', r3(body * 0.95));
            setA(b.c, 'bs' + i, 'stroke-opacity', r3(k * (pi > 0 ? (1 - pi) * 1.0 : 0.75)));
            var circ = 2 * Math.PI * b.r, seg = circ / 8, dash = seg * (1 - 0.8 * pi);
            setA(b.c, 'bd' + i, 'stroke-dasharray', pi > 0 ? r3(dash) + ' ' + r3(seg - dash) : 'none');
            setA(b.c, 'bw' + i, 'stroke-width', r3(1.6 + 1.6 * Math.sin(Math.PI * pi)));
            setA(b.hi, 'bh' + i, 'stroke-opacity', r3(body * 0.9));
          });
        }

        // billboard brightness: pre-baked glow layers driven by opacity (dips to 0.6, boost to 1.3)
        var gB = Math.max(0, num(s.billboardGlow, 1));
        setA(bbGlow, 'bbg', 'fill-opacity', r3(LB.clamp(0.62 * gB, 0, 1)));
        setA(bbCones, 'bbc', 'fill-opacity', r3(LB.clamp((gB - 0.6) / 0.7, 0, 1.3) / 1.3));
        var tg = r3(LB.clamp(0.16 + (gB - 1) * 1.3, 0, 1));
        setA(bbTextGlow, 'bbt', 'fill-opacity', tg);
        setA(bbTextGlow, 'bbt2', 'stroke-opacity', tg);
        var dim = LB.clamp((1 - gB) * 0.95, 0, 0.85);
        vis(bbDim, 'bbdv', dim > 0.001);
        if (dim > 0.001) setA(bbDim, 'bbd', 'fill-opacity', r3(dim));

        // golden arches: halo opacity/scale, blurred neon and a warm wash for the flare
        var a = Math.max(0, num(s.archesGlow, 1)), ex = Math.max(0, a - 1);
        setA(archHalo, 'ah', 'fill-opacity', r3(LB.clamp(0.5 + ex * 0.42, 0, 1) * Math.min(1, a)));
        setA(archHalo, 'ahs', 'transform', 'scale(' + r3(1 + ex * 0.95) + ')');
        setA(archBlur, 'ab', 'opacity', r3(LB.clamp(0.62 * a, 0, 1)));
        setA(archBlur, 'abw', 'stroke-width', r3(9 + ex * 5));
        vis(archWash, 'awv', ex > 0.001);
        if (ex > 0.001) setA(archWash, 'aw', 'fill-opacity', r3(LB.clamp(ex * 0.85, 0, 1)));
        setA(archCore, 'ac', 'stroke', LB.lerpColor('#FFEDB0', '#FFFBEA', LB.clamp(ex / 1.2, 0, 1)));
      },
    };
  }

  LB.register('scene', { create: create });
})();

<script>/* fx.js */
/* Logan Bishops: fx.js (fx artist).
 * Anime effects and on-screen text cards. API: docs/CONTRACT.md "FX". Looks: docs/STORYBOARD.md "FX list" and "On-screen text".
 * The director owns WHEN (every k, p, age); this file owns HOW. Every visual is a pure function of (fxState, t):
 * all DOM is built once in create(), update() only sets attributes, transforms, opacity and display.
 * Layers: world fx -> stage.layers.fxWorld (moves with the camera), screen fx -> stage.layers.fxScreen,
 * text cards -> stage.layers.text (overlay svg, viewBox 0..1000, sizes are % of frame height x 10). */
(function () {
  'use strict';
  var LB = window.LB;
  var PI = Math.PI, TAU = PI * 2;

  var FONT_JP = "'Dela Gothic One', 'Hiragino Kaku Gothic StdN', 'Yu Gothic', 'Noto Sans JP', sans-serif";
  var FONT_BANG = "'Bangers', Impact, 'Arial Black', sans-serif";
  var FONT_ROUND = "'M PLUS Rounded 1c', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif";
  var GREEN = '#3CFF6E', YELLOW = '#FFD60A', INK = '#111111';

  // Ask the browser for the exact glyph subsets the cards use (CJK fonts are split by unicode-range and would
  // otherwise only download the first time a card shows). Runs before main.js waits on document.fonts.ready.
  (function preloadCardGlyphs() {
    try {
      if (!document.fonts || !document.fonts.load) return;
      var swallow = function () {};
      document.fonts.load('400 100px "Dela Gothic One"', 'ゴン!!訴訟編却下').catch(swallow);
      document.fonts.load('400 100px "Bangers"', 'THE LAWSUIT ARC CASE DISMISSED').catch(swallow);
      document.fonts.load('900 100px "M PLUS Rounded 1c"', 'CLASS: HEALER +999').catch(swallow);
    } catch (e) { /* fonts API missing: cards fall back to system fonts */ }
  })();

  // ------------------------------------------------------------------ small helpers
  function n2(v) { return Math.round(v * 100) / 100; }
  function c01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function num(v, d) { return typeof v === 'number' && isFinite(v) ? v : d; }
  function vis(node, on) {
    on = !!on;
    if (node.__lbOn !== on) { node.__lbOn = on; node.style.display = on ? '' : 'none'; }
    return on;
  }
  function setOp(node, k) {
    var v = n2(c01(k));
    if (node.__lbOp !== v) { node.__lbOp = v; node.setAttribute('opacity', v); }
  }
  function tf(node, x, y, rot, sx, sy) {
    var s = 'translate(' + n2(x) + ' ' + n2(y) + ')';
    if (rot) s += ' rotate(' + n2(rot) + ')';
    if (sx != null && (sx !== 1 || (sy != null && sy !== 1))) s += ' scale(' + LB.r4(sx) + ' ' + LB.r4(sy != null ? sy : sx) + ')';
    node.setAttribute('transform', s);
  }
  function url(id) { return 'url(#' + id + ')'; }
  function grad(defs, kind, stops, attrs) {
    var id = LB.uid('fxg');
    var a = { id: id };
    for (var key in attrs || {}) a[key] = attrs[key];
    var g = LB.el(kind, a, defs);
    stops.forEach(function (s) {
      LB.el('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, g);
    });
    return id;
  }
  // 4-point CONCAVE star (curved inward arms). R = vertical arm, H = horizontal arm, q = fullness (0.04 needle kira, 0.35 soft twinkle)
  function starD(R, H, q) {
    var a = R * q, b = H * q;
    return 'M0 ' + n2(-R) +
      'C0 ' + n2(-a) + ' ' + n2(b) + ' 0 ' + n2(H) + ' 0' +
      'C' + n2(b) + ' 0 0 ' + n2(a) + ' 0 ' + n2(R) +
      'C0 ' + n2(a) + ' ' + n2(-b) + ' 0 ' + n2(-H) + ' 0' +
      'C' + n2(-b) + ' 0 0 ' + n2(-a) + ' 0 ' + n2(-R) + 'Z';
  }
  // circle as a clockwise subpath (so several can share one path element)
  function circD(x, y, r) {
    if (r <= 0.01) return '';
    return 'M' + n2(x - r) + ' ' + n2(y) + 'a' + n2(r) + ' ' + n2(r) + ' 0 1 1 ' + n2(2 * r) + ' 0a' + n2(r) + ' ' + n2(r) + ' 0 1 1 ' + n2(-2 * r) + ' 0Z';
  }
  function at2world(ctx, at, fallback) {
    if (!at) return fallback || { x: 500, y: 500 };
    var p = LB.resolveAt(ctx, at);
    return p && isFinite(p.x) && isFinite(p.y) ? p : (fallback || { x: 500, y: 500 });
  }
  function at2screen(stage, ctx, at, fallback) {
    if (!at) return fallback || { x: 500, y: 500 };
    return LB.worldToScreen(stage, at2world(ctx, at));
  }
  function twos(t) { return Math.floor(t * 12 + 1e-6); }
  function jit(seed, amp) { return (LB.hash(seed) - 0.5) * 2 * amp; }

    var o = { 'text-anchor': 'middle', text: str };

  }

  // ======================================================================= create
  LB.register('fx', {
    create: function (stage, ctx) {
      var W = stage.layers.fxWorld, S = stage.layers.fxScreen, T = stage.layers.text;
      var dW = stage.defsWorld, dS = stage.defsOverlay;
      var RM = !!LB.reducedMotion;
      var fx = {};

      // z-order inside fxWorld (back to front)
      var gTwinkles = LB.g(W, { class: 'fx-twinkles' });
      var gBishounen = LB.g(W, { class: 'fx-bishounen' });
      var gArches = LB.g(W, { class: 'fx-arches' });
      var gGloom = LB.g(W, { class: 'fx-gloom' });
      var gHeal = LB.g(W, { class: 'fx-heal' });
      var gPuff = LB.g(W, { class: 'fx-puff' });
      var gNotes = LB.g(W, { class: 'fx-notes' });
      var gGlints = LB.g(W, { class: 'fx-glints' });
      // z-order inside fxScreen
      var gSpeed = LB.g(S, { class: 'fx-speed' });
      var gBurst = LB.g(S, { class: 'fx-burst' });
      var gFocus = LB.g(S, { class: 'fx-focus' });
      var gFlash = LB.g(S, { class: 'fx-flash' });
      [gTwinkles, gBishounen, gArches, gGloom, gHeal, gPuff, gNotes, gGlints, gSpeed, gBurst, gFocus, gFlash]
        .forEach(function (g) { g.setAttribute('pointer-events', 'none'); vis(g, false); });
      T.setAttribute('pointer-events', 'none');

      // ------------------------------------------------------------ glints (kira star, world)
      (function () {
        var halo = grad(dW, 'radialGradient', [[0, '#FFFFFF', 1], [0.16, '#FFFBEA', 0.95], [0.42, '#FFE08A', 0.42], [0.75, '#FFC94D', 0.1], [1, '#FFC23A', 0]]);
        var pool = [];
        for (var i = 0; i < 4; i++) {
          var g = LB.g(gGlints);
          LB.el('circle', { r: 64, fill: url(halo) }, g);
          // short diagonal secondary sparkle, then the main long-armed concave star with a thin gold rim
          LB.path(g, starD(52, 52, 0.04), { fill: '#FFFFFF', stroke: '#F1C24E', 'stroke-width': 4, 'paint-order': 'stroke', opacity: 0.85, transform: 'rotate(45)' });
          LB.path(g, starD(100, 80, 0.05), { fill: '#FFFFFF', stroke: '#E2A92A', 'stroke-width': 6.5, 'stroke-linejoin': 'round', 'paint-order': 'stroke' });
          LB.el('circle', { r: 15, fill: '#FFFFFF' }, g);
          vis(g, false);
          pool.push(g);
        }
        fx.glints = function (list, t) {
          var any = false;
          list = Array.isArray(list) ? list : (list ? [list] : []);
          for (var i = 0; i < pool.length; i++) {
            var gl = list[i], g = pool[i];
            var k = gl ? Math.max(0, num(gl.k, 0)) : 0;
            if (!vis(g, k > 0.002)) continue;
            any = true;
            var p = at2world(ctx, gl.at);
            var s = k * num(gl.size, 36) / 100;
            tf(g, p.x, p.y, num(gl.rot, 0), s);
            setOp(g, k * 1.8);
          }
          vis(gGlints, any);
        };
      })();

      // ------------------------------------------------------------ twinkles (shoujo, pink-gold, around the trio, world)
      (function () {
        var gPink = grad(dW, 'radialGradient', [[0, '#FFFFFF'], [0.16, '#FFE8F4'], [0.5, '#FF8DC7'], [1, '#FF4FA3']]);
        var gGold = grad(dW, 'radialGradient', [[0, '#FFFFFF'], [0.16, '#FFF7D6'], [0.5, '#FFD55C'], [1, '#F2A600']]);
        // hand-placed around the three silhouettes, never over a face (world units)
        var spots = [
          [166, 296, 40, 'p'], [124, 458, 22, 'g'], [226, 200, 26, 'g'], [404, 236, 28, 'p'], [386, 320, 15, 'g'],
          [452, 168, 18, 'g'], [604, 148, 34, 'g'], [632, 50, 18, 'p'], [846, 146, 38, 'p'], [876, 292, 22, 'g'],
          [806, 38, 17, 'g'], [178, 600, 20, 'p'], [882, 470, 27, 'g'], [612, 522, 16, 'p'],
        ];
        var items = spots.map(function (s, i) {
          var g = LB.g(gTwinkles);
          var ring = LB.el('circle', { r: 1, fill: 'none', stroke: s[3] === 'p' ? '#FFB6DA' : '#FFE08A', 'stroke-width': 0.16 }, g);
          var star = LB.path(g, starD(1, 0.78, 0.12), { fill: url(s[3] === 'p' ? gPink : gGold), stroke: s[3] === 'p' ? '#C7357F' : '#B97A06', 'stroke-width': 0.09, 'stroke-linejoin': 'round', 'paint-order': 'stroke' });
          return { g: g, ring: ring, star: star, x: s[0], y: s[1], size: s[2],
            d: (i * 0.37) % 1 * 0.6, f: 1.6 + LB.hash(i + 3) * 1.4, ph: LB.hash(i + 11), r0: (LB.hash(i + 21) - 0.5) * 30 };
        });
        fx.twinkles = function (st, t) {
          var k = st ? c01(num(st.k, 0)) : 0, pop = st ? c01(num(st.pop, 0)) : 0;
          if (!vis(gTwinkles, k > 0.002 && pop < 0.999)) return;
          items.forEach(function (it) {
            var a = LB.smoothstep(it.d, it.d + 0.4, k);
            if (!vis(it.g, a > 0.002)) return;
            var pulse = 0.72 + 0.28 * Math.sin(TAU * (t * it.f + it.ph));
            var s = it.size * a * pulse * (1 + 0.7 * pop);
            var rot = it.r0 + 18 * Math.sin(TAU * (t * 0.6 + it.ph));
            tf(it.g, it.x, it.y, rot);
            it.star.setAttribute('transform', 'scale(' + n2(s) + ')');
            setOp(it.star, 1 - LB.smoothstep(0, 0.55, pop));
            if (vis(it.ring, pop > 0.001)) {
              var rr = it.size * a * (0.35 + 1.25 * LB.ease.outCubic(pop));
              it.ring.setAttribute('r', n2(rr));
              it.ring.setAttribute('stroke-width', n2(Math.max(0.6, it.size * 0.16 * (1 - pop))));
              setOp(it.ring, Math.sin(PI * pop) * 1.2);
            }
          });
        };
      })();

      // ------------------------------------------------------------ impact burst (screen space, red impact frame)
      (function () {
        var rnd = LB.rng(1102);
        var d = '', N = 44;
        for (var i = 0; i < N; i++) {
          var ang = (i + (rnd() - 0.5) * 0.7) / N * TAU;
          var r0 = 120 + rnd() * 190 + (i % 5 === 0 ? -60 : 0);
          var r1 = 1700, hw = 0.006 + rnd() * 0.02;
          d += 'M' + n2(Math.cos(ang) * r0) + ' ' + n2(Math.sin(ang) * r0) +
            'L' + n2(Math.cos(ang - hw) * r1) + ' ' + n2(Math.sin(ang - hw) * r1) +
            'L' + n2(Math.cos(ang + hw) * r1) + ' ' + n2(Math.sin(ang + hw) * r1) + 'Z';
        }
        var spin = LB.g(gBurst);
        LB.path(spin, d, { fill: '#FFFFFF' });

          var a2 = j / (M * 2) * TAU, r = j % 2 ? 26 + rnd() * 10 : 58 + rnd() * 34;

        }
        LB.path(spin, jag + 'Z', { fill: '#FFFFFF', stroke: INK, 'stroke-width': 5, 'stroke-linejoin': 'round', 'paint-order': 'stroke' });
        fx.impactBurst = function (st, t) {
          var k = st ? c01(num(st.k, 0)) : 0;
          if (!vis(gBurst, k > 0.002)) return;
          var p = at2screen(stage, ctx, st.at, { x: 500, y: 500 });
          var f = twos(t);
          tf(gBurst, p.x, p.y, 0);
          spin.setAttribute('transform', 'rotate(' + n2(jit(f * 1.7 + 4, 6)) + ') scale(' + n2(0.92 + 0.16 * LB.hash(f + 9)) + ')');
          setOp(gBurst, k);
        };
      })();

      // ------------------------------------------------------------ speed lines (screen space, regenerated per seed = on twos)
      (function () {
        var gRad = LB.g(gSpeed), gVer = LB.g(gSpeed);
        var radDark = LB.path(gRad, '', { fill: INK, opacity: 0.88 });
        var radLight = LB.path(gRad, '', { fill: '#FFFFFF', opacity: 0.92 });
        var verDark = LB.path(gVer, '', { fill: INK, opacity: 0.8 });
        var verLight = LB.path(gVer, '', { fill: '#FFFFFF', opacity: 0.9 });
        var lastKey = null;
        function radial(seed) {
          var rnd = LB.rng(seed * 7919 + 17), dk = '', lt = '', N = 72;
          for (var i = 0; i < N; i++) {
            var ang = (i + rnd() * 0.9) / N * TAU;
            var r0 = 250 + rnd() * 230, r1 = 1500, hw = 0.004 + rnd() * 0.014;
            var s = 'M' + n2(Math.cos(ang) * r0) + ' ' + n2(Math.sin(ang) * r0) +
              'L' + n2(Math.cos(ang - hw) * r1) + ' ' + n2(Math.sin(ang - hw) * r1) +
              'L' + n2(Math.cos(ang + hw) * r1) + ' ' + n2(Math.sin(ang + hw) * r1) + 'Z';
            if (rnd() < 0.62) dk += s; else lt += s;
          }
          radDark.setAttribute('d', dk); radLight.setAttribute('d', lt);
        }
        function vertical(seed) {
          var rnd = LB.rng(seed * 104729 + 5), dk = '', lt = '', N = 46;
          for (var i = 0; i < N; i++) {
            // denser toward the frame edges, sparse over the subject in the middle

          tf(inner, 500 + jit(f * 2.3 + 5, sh), 818 + jit(f * 4.1 + 6, sh), 0, s);
          setOp(bandNode, c01(age / 0.08));
          setOp(g, k);
        };
        cards.arc.g = g;
      })();

      // ---- T4 healer: CLASS: HEALER inside a JRPG menu window, lower-left, slides in from the left
      (function () {
        var g = LB.g(T, { class: 'fx-card-healer' });
        var win = grad(dS, 'linearGradient', [[0, '#26389A'], [0.5, '#16226A'], [1, '#0A1240']], { x1: 0, y1: 0, x2: 0, y2: 1 });
        var X = 40, Y = 796, Wd = 632, H = 108;
        LB.el('rect', { x: X + 7, y: Y + 8, width: Wd, height: H, rx: 16, fill: '#000000', opacity: 0.45 }, g);
        LB.el('rect', { x: X, y: Y, width: Wd, height: H, rx: 16, fill: url(win), stroke: '#FFFFFF', 'stroke-width': 7.5 }, g);
        LB.el('rect', { x: X + 9, y: Y + 9, width: Wd - 18, height: H - 18, rx: 10, fill: 'none', stroke: '#9FB4FF', 'stroke-opacity': 0.55, 'stroke-width': 2 }, g);
        // top sheen like an old console window
        LB.el('rect', { x: X + 12, y: Y + 12, width: Wd - 24, height: 22, rx: 8, fill: '#FFFFFF', opacity: 0.08 }, g);
        var cursor = LB.path(g, 'M0 -16L22 0L0 16Z', { fill: '#FFFFFF', stroke: '#0A1240', 'stroke-width': 2 });
        var tx = { x: X + 76, y: Y + H / 2 + 24, 'text-anchor': 'start', 'font-family': FONT_ROUND, 'font-weight': 900, 'font-size': 65, textLength: 508, lengthAdjust: 'spacingAndGlyphs' };
        textEl(g, 'CLASS: HEALER', Object.assign({ dx: 4, dy: 4, fill: '#050A26' }, tx));
        textEl(g, 'CLASS: HEALER', Object.assign({ fill: '#FFFFFF' }, tx));
        vis(g, false);
        cards.healer = function (age, k) {
          var e = LB.ease.outCubic(c01(age / 0.06));
          var bob = Math.floor(age * 6) % 2 ? 0 : 5;
          tf(cursor, X + 32 + bob, Y + H / 2, 0);
          tf(g, -720 * (1 - e), 0, 0);
          setOp(g, k);
        };
        cards.healer.g = g;
      })();

      // ---- T5 hp: +999 HP, green fill, dark green stroke + white outer stroke, rises 60 from above the Friar's bump
      (function () {
        var g = LB.g(T, { class: 'fx-card-hp' });
        var inner = LB.g(g);
        var fill = grad(dS, 'linearGradient', [[0, '#B9FFCB'], [0.42, GREEN], [1, '#1FD255']], { x1: 0, y1: 0, x2: 0, y2: 1 });
        var a = { x: 0, y: 34, 'font-family': FONT_ROUND, 'font-weight': 900, 'font-size': 90, 'stroke-linejoin': 'round' };
        function build(attrs) {
          var t = textEl(inner, '', Object.assign({}, a, attrs));
          LB.el('tspan', { text: '+999' }, t);
          LB.el('tspan', { 'font-size': 66, dx: 8, text: 'HP' }, t);
          return t;
        }
        // dark green ring wide enough to close the small counters of the 9s, white rim beyond it
        build({ fill: '#FFFFFF', stroke: '#FFFFFF', 'stroke-width': 30 });
        build({ fill: url(fill), stroke: '#0B4A1E', 'stroke-width': 17, 'paint-order': 'stroke' });
        vis(g, false);
        cards.hp = function (age, k, t) {
          var pop = age < 0.07 ? LB.lerp(0.6, 1.15, LB.ease.outQuad(age / 0.07)) : age < 0.14 ? LB.lerp(1.15, 1, LB.ease.inOutQuad((age - 0.07) / 0.07)) : 1;
          var rise = 60 * LB.ease.outCubic(c01(age / 0.5));
          // follow the Friar's head (stable when the bump pops at 4.38); start just above where the bump sits
          var h = ctx.chars && ctx.chars.friar ? ctx.anchor('friar', 'head') : null;
          var b = h ? LB.worldToScreen(stage, { x: h.x, y: h.y - 84 }) : { x: 300, y: 330 };
          var x = LB.clamp(b.x, 210, 790), y = LB.clamp(b.y - 100, 90, 900);
          tf(g, x, y - rise, 0);
          inner.setAttribute('transform', 'scale(' + n2(pop) + ')');
          setOp(g, k); // the director fades k over the card's last 0.08 s
        };
        cards.hp.g = g;
      })();

      // ---- T6 stamp: 却下 red hanko (double border, rough ink, ink gaps), rotated -14, slams in; CASE DISMISSED below
      (function () {
        var g = LB.g(T, { class: 'fx-card-stamp' });
        var inner = LB.g(g);
        var RED = '#D0161E', Wd = 440, H = 256;
        var rnd = LB.rng(4920);
        function roughRect(w, h, r, step, amp, seed) {
          var pts = [], hw = w / 2, hh = h / 2, u = 0;
          function push(x, y, nx, ny) {
            var j = amp * LB.noise1(u * 0.11, seed) + amp * 0.45 * (rnd() - 0.5);
            pts.push(n2(x + nx * j) + ' ' + n2(y + ny * j)); u += 1;
          }
          function seg(x0, y0, x1, y1, nx, ny) {
            var n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
            for (var i = 0; i < n; i++) push(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, nx, ny);
          }
          function arc(cx, cy, a0, a1) {
            var n = Math.max(2, Math.round(r * Math.abs(a1 - a0) / step));
            for (var i = 0; i < n; i++) { var a = a0 + (a1 - a0) * i / n; push(cx + Math.cos(a) * r, cy + Math.sin(a) * r, Math.cos(a), Math.sin(a)); }
          }
          seg(-hw + r, -hh, hw - r, -hh, 0, -1); arc(hw - r, -hh + r, -PI / 2, 0);
          seg(hw, -hh + r, hw, hh - r, 1, 0); arc(hw - r, hh - r, 0, PI / 2);
          seg(hw - r, hh, -hw + r, hh, 0, 1); arc(-hw + r, hh - r, PI / 2, PI);
          seg(-hw, hh - r, -hw, -hh + r, -1, 0); arc(-hw + r, -hh + r, PI, PI * 1.5);
          return 'M' + pts.join('L') + 'Z';
        }
        // paper ground of the impression: keeps the red ink readable over the red cape and the tan robe
        var paperG = grad(dS, 'radialGradient', [[0, '#FFFDF8'], [0.75, '#FBF1E4'], [1, '#F2E2CF']]);
        LB.path(inner, roughRect(Wd + 22, H + 22, 44, 14, 2.2, 9), { fill: url(paperG), opacity: 0.93, stroke: INK, 'stroke-opacity': 0.25, 'stroke-width': 2 });
        // ink mask: white = ink, black flecks and slivers = ink gaps, soft gray = thin ink
        var mid = LB.uid('fxmask');
        var mask = LB.el('mask', { id: mid, maskUnits: 'userSpaceOnUse', maskContentUnits: 'userSpaceOnUse', x: -300, y: -200, width: 600, height: 400 }, dS);
        LB.el('rect', { x: -300, y: -200, width: 600, height: 400, fill: '#FFFFFF' }, mask);
        var thin = grad(dS, 'radialGradient', [[0, '#B4B4B4'], [0.55, '#DCDCDC'], [1, '#FFFFFF', 0]]);
        [[-150, -96, 70], [176, 92, 64], [60, -20, 46]].forEach(function (b) {
          LB.el('ellipse', { cx: b[0], cy: b[1], rx: b[2], ry: b[2] * 0.55, fill: url(thin) }, mask);
        });
        var fleck = '';
        for (var i = 0; i < 56; i++) {
          var fx0 = (rnd() - 0.5) * Wd * 1.02, fy0 = (rnd() - 0.5) * H * 1.02;
          fleck += circD(fx0, fy0, 0.7 + Math.pow(rnd(), 2.2) * 3);
        }
        // ink gaps where the rubber did not touch: slivers across the borders
        [[-150, -128, 20, 0.08], [212, -46, 15, 1.62], [64, 128, 24, -0.06], [-219, 72, 13, 1.5], [128, -114, 10, 0.1], [-36, 113, 9, 0.04], [-205, -20, 8, 1.55]].forEach(function (s) {
          var ca = Math.cos(s[3]), sa = Math.sin(s[3]), L = s[2], w = 3.6;
          fleck += 'M' + n2(s[0] - ca * L) + ' ' + n2(s[1] - sa * L) + 'Q' + n2(s[0] - sa * w) + ' ' + n2(s[1] + ca * w) + ' ' +
            n2(s[0] + ca * L) + ' ' + n2(s[1] + sa * L) + 'Q' + n2(s[0] + sa * w * 0.5) + ' ' + n2(s[1] - ca * w * 0.5) + ' ' +
            n2(s[0] - ca * L) + ' ' + n2(s[1] - sa * L) + 'Z';
        });
        LB.path(mask, fleck, { fill: '#000000' });
        var ink = LB.g(inner, { mask: url(mid) });
        // double border as one even-odd path: thick outer ring + thin inner ring, both with wobbly ink edges
        var ring = roughRect(Wd, H, 34, 8, 1.5, 1) + roughRect(Wd - 30, H - 30, 21, 8, 1.3, 2) +
          roughRect(Wd - 46, H - 46, 14, 8, 1.1, 3) + roughRect(Wd - 56, H - 56, 10, 8, 1.0, 4);
        LB.path(ink, ring, { fill: RED, 'fill-rule': 'evenodd' });
        textEl(ink, '却下', { x: 3, y: 66, 'font-family': FONT_JP, 'font-size': 176, 'letter-spacing': 6, fill: RED });
        // ink splatter thrown off when it lands
        var splat = '';
        [[-244, -112, 4.2], [-232, -136, 2], [250, 120, 4.8], [266, 98, 2.2], [238, -138, 2.6], [-258, 128, 3]].forEach(function (s) { splat += circD(s[0], s[1], s[2]); });
        var splatNode = LB.path(ink, splat, { fill: RED });
        // landing shockwave: the stamp outline kicked outward once
        var wave = LB.el('rect', { x: -Wd / 2, y: -H / 2, width: Wd, height: H, rx: 36, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 7 }, inner);
        var eng = LB.g(g);
        textEl(eng, 'CASE DISMISSED', { x: 0, y: 23, 'font-family': FONT_BANG, 'font-size': 60, 'letter-spacing': 3, fill: '#FFFFFF', stroke: INK, 'stroke-width': 11, 'stroke-linejoin': 'round', 'paint-order': 'stroke' });
        vis(g, false);
        cards.stamp = function (age, k, t) {
          var land = 0.06, s;
          if (age < land) s = LB.lerp(1.8, 1, LB.ease.inQuad(age / land));
          else s = 1 - 0.045 * Math.sin(PI * c01((age - land) / 0.08));
          var sh = age >= land && age < 0.2 ? (RM ? 2 : 5) * (1 - (age - land) / 0.14) : 0, f = twos(t);
          tf(g, 692 + jit(f * 1.9 + 8, sh), 662 + jit(f * 3.7 + 9, sh), -14);
          inner.setAttribute('transform', 'scale(' + n2(s) + ')');
          setOp(inner, age < land ? 0.6 + 0.4 * (age / land) : 1);
          vis(splatNode, age >= land);
          var w = (age - land) / 0.14;
          if (vis(wave, w >= 0 && w < 1)) {
            wave.setAttribute('transform', 'scale(' + n2(1 + 0.22 * LB.ease.outCubic(w)) + ')');
            wave.setAttribute('stroke-width', n2(8 * (1 - w) + 1));
            setOp(wave, 1 - w);
          }
          var e = c01((age - 0.08) / 0.08);
          if (vis(eng, e > 0)) {
            tf(eng, 0, H / 2 + 64, 0, LB.lerp(1.5, 1, LB.ease.outBack(e)));
            setOp(eng, e);
          }
          setOp(g, k);
        };
        cards.stamp.g = g;
      })();

      fx.cards = function (list, t) {
        var on = {};
        (Array.isArray(list) ? list : []).forEach(function (c) {
          if (!c || !cards[c.id]) return;
          var k = c01(num(c.k, 1));
          if (k <= 0.002) return;
          on[c.id] = true;
          vis(cards[c.id].g, true);
          cards[c.id](Math.max(0, num(c.age, 0)), k, t);
        });
        for (var id in cards) if (!on[id]) vis(cards[id].g, false);
      };

      var ORDER = ['twinkles', 'bishounen', 'archesFlare', 'gloom', 'heal', 'puff', 'notes', 'glints', 'speedLines', 'impactBurst', 'focus', 'flash', 'cards'];
      return {
        update: function (fxState, t) {
          var s = fxState || {};
          t = num(t, 0);
          for (var i = 0; i < ORDER.length; i++) {
            var key = ORDER[i];
            try { fx[key](s[key], t); } catch (e) {
              // one bad field must never take the whole frame down; report once per field
              if (!fx['__err' + key]) { fx['__err' + key] = true; if (window.console) console.warn('[fx] ' + key + ': ' + e.message); }
            }
          }
        },
      };
    },
  });
})();

<script>/* audio.js */
/* Logan Bishops: sound design. The STORYBOARD "Audio cue sheet", synthesized with WebAudio only (oscillators, a seeded
 * noise buffer, biquad filters, tanh wave shaping and gain envelopes). No samples, no external assets.
 *
 * API (CONTRACT "Audio"):  LB.register('audio', { init(ctx), update(t, loops), setMuted(bool), isMuted() })
 *   extras: renderLoop(sampleRate[, { only: [cueIds], level }]) -> Promise<AudioBuffer>: one 6 s loop rendered offline
 *           through the same cue code and master chain (QA); cueSheet() -> [{ id, t, dur, level }];
 *           _debug.log(true|false) / _debug.state() (QA scheduling log and live state).
 *
 * - Muted by default. No AudioContext exists until setMuted(false) is called from a user gesture (iOS Safari rule):
 *   the context is created (or resumed) and unlocked right there. Muting fades the master out in about 40 ms, cancels
 *   every pending source and, 0.4 s later, suspends the context (battery); the next unmute resumes it.
 * - Look-ahead scheduler: every frame update(t, loops) maps the absolute loop position P = loops * D + t onto the
 *   AudioContext clock and schedules each cue whose loop time falls in the next LOOKAHEAD (0.2) seconds. Cues are keyed
 *   by their absolute position and the scheduled range only moves forward, so nothing is scheduled twice; the wrap at
 *   LB.D is just the next loop index. Seeks, pauses, stalls and tab switches are detected (the loop clock and the audio
 *   clock disagree) and restart the mapping cleanly; small drift is followed smoothly. Nothing is scheduled while
 *   LB.clock.paused (sounding cues are faded out), or while LB.clock.rate is not 1 (QA slow motion is silent).
 * - Unmuting mid-loop starts with the cues after the current time. A sustained cue already in progress (drone, buzz,
 *   whistles, heal charge, deflate) starts partway with a 30 ms fade-in when the context has been running long enough
 *   for its own timeline to be valid; on the very first unmute it is skipped.
 * - A/V sync: cues land on their storyboard time at the limiter output (its fixed 6 ms look-ahead is compensated) and
 *   any reported output latency beyond about one display frame is scheduled early.
 * - Master chain: master gain -> DynamicsCompressor (gentle limiter, about +3 dB makeup) -> destination.
 * - Silence: nothing sounds from the end of the shutter's second click (5.62) through the seam to the knob ting at
 *   0.38: no room tone, no running sources, exact digital zero, so there is nothing to click at the seam.
 */
(function () {
  'use strict';
  var LB = window.LB;

  // ---------------------------------------------------------------- tuning
  var LOOKAHEAD = 0.2;     // seconds of loop time scheduled ahead of the clock
  var LEVEL = 1.0;         // master gain into the limiter (hits peak about -1.5 dBFS, quiet cues lifted for phones)
  var PRE = 0.006;         // DynamicsCompressor look-ahead delay (Chromium and WebKit); cues are scheduled this early
  var MUSIC_CUT = 1.02;    // BONK: every music voice hard-stops here
  var DISPLAY_LAT = 0.025; // rough rAF-to-glass latency; audio output latency beyond this is scheduled early
  var DRIFT_SOFT = 0.045;  // audio clock vs loop clock disagreement that re-anchors the mapping
  var DRIFT_HARD = 0.3;    // ... that counts as a jump (seek, stall, tab switch): restart cleanly
  var LATE_OK = 0.03;      // a cue at most this late still plays (shifted to now); later ones are skipped
  // peak levels per cue class (before the master gain)
  var LV = { vlow: 0.05, low: 0.12, med: 0.24, high: 0.45 };

  // ---------------------------------------------------------------- notes
  var SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) { // 'C5', 'F#6', 'Eb2'
    var m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    var s = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (12 * (parseInt(m[3], 10) + 1) + s - 69) / 12);
  }

  // ---------------------------------------------------------------- per-context shared buffers
  function noiseBuffer(ac) {
    if (ac.__lbNoise) return ac.__lbNoise;
    var len = Math.round(ac.sampleRate), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    var r = LB.rng(0x5eed1);
    for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;
    return (ac.__lbNoise = b);
  }
  function satCurve(ac) {
    if (ac.__lbSat) return ac.__lbSat;
    var n = 1024, c = new Float32Array(n), k = 2.2, norm = Math.tanh(k);
    for (var i = 0; i < n; i++) { var x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(k * x) / norm; }
    return (ac.__lbSat = c);
  }

  // ---------------------------------------------------------------- envelope helpers (AudioParam)
  // percussive: 0 -> peak in atk, exponential decay to -60 dB over dec, then exactly 0. Returns the end time.
  function perc(p, t0, peak, atk, dec) {
    p.setValueAtTime(0, t0);
    p.linearRampToValueAtTime(peak, t0 + atk);
    p.exponentialRampToValueAtTime(peak * 0.001, t0 + atk + dec);
    p.linearRampToValueAtTime(0, t0 + atk + dec + 0.003);
    return t0 + atk + dec + 0.004;
  }
  // piecewise linear: pts = [[t, v], ...] (absolute times), starting from the first value
  function shape(p, pts) {
    p.setValueAtTime(pts[0][1], pts[0][0]);
    for (var i = 1; i < pts.length; i++) p.linearRampToValueAtTime(pts[i][1], pts[i][0]);
  }
  function holdAt(p, now) {
    if (p.cancelAndHoldAtTime) { p.cancelAndHoldAtTime(now); return; }
    var v = p.value;
    p.cancelScheduledValues(now);
    p.setValueAtTime(v, now);
  }

  // ---------------------------------------------------------------- voices
  // One Voice per scheduled cue occurrence. Every node it makes ends in v.out (a gain), so the scheduler can fade or
  // cancel the whole cue, and every source it starts is listed in v.srcs so it can be stopped.
  function Voice(ac, dest, cue, T, base, A) {
    this.ac = ac; this.cue = cue; this.T = T; this.base = base; this.A = A;
    this.srcs = [];
    this.hardStop = Infinity;
    this.out = ac.createGain();
    this.out.connect(dest);
    this.start = T;
    this.end = T + cue.dur + 0.1;
  }
  Voice.prototype.gain = function (dest, v) {
    var g = this.ac.createGain();
    g.gain.value = v == null ? 0 : v;
    g.connect(dest || this.out);
    return g;
  };
  Voice.prototype.osc = function (type, f, t0, t1, dest) {
    var o = this.ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    o.start(t0);
    o.stop(Math.min(t1, this.hardStop));
    if (dest) o.connect(dest);
    this.srcs.push(o);
    return o;
  };
  Voice.prototype.noise = function (t0, t1, dest) {
    var s = this.ac.createBufferSource();
    s.buffer = noiseBuffer(this.ac);
    s.loop = true;
    // a different stretch of the noise buffer per cue keeps hits from sounding identical
    s.start(t0, (this.cue.seed * 0.137) % 0.9);
    s.stop(Math.min(t1, this.hardStop));
    if (dest) s.connect(dest);
    this.srcs.push(s);
    return s;
  };
  Voice.prototype.filter = function (type, f, q, dest) {
    var b = this.ac.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    b.Q.value = q == null ? 0.707 : q;
    if (dest) b.connect(dest);
    return b;
  };
  Voice.prototype.pan = function (x) {
    if (!this.ac.createStereoPanner) return this.out;
    var p = this.ac.createStereoPanner();
    p.pan.value = x;
    p.connect(this.out);
    return p;
  };
  // soft saturation (tanh) so low thuds grow harmonics that phone speakers can actually reproduce
  Voice.prototype.sat = function (outLevel, dest) {
    var w = this.ac.createWaveShaper();
    w.curve = satCurve(this.ac);
    w.connect(this.gain(dest, outLevel));
    return w;
  };
  // sine LFO into an AudioParam (detune in cents, or a gain); depth may be a number or [[t, depth], ...]
  Voice.prototype.lfo = function (rate, depth, param, t0, t1) {
    var o = this.osc('sine', rate, t0, t1);
    var g = this.ac.createGain();
    if (typeof depth === 'number') g.gain.value = depth; else shape(g.gain, depth);
    o.connect(g);
    g.connect(param);
    return o;
  };

  // ---------------------------------------------------------------- the cue sheet
  // Each cue: id, loop time t (onset), dur (how long it can sound), play(v, T) with T = AudioContext time of the onset.
  // music: true -> hard-stopped at the BONK. sustain: true -> may start partway when sound is switched on mid-cue.
  var CUES = [];
  function cue(id, t, dur, level, play, opt) {
    CUES.push({ id: id, t: t, dur: dur, level: level, play: play, seed: CUES.length + 1,
      music: !!(opt && opt.music), sustain: !!(opt && opt.sustain) });
  }

  // 0.38 knob ting: sine 2.6 kHz, 120 ms exponential decay (plus a faint inharmonic glint partial)
  cue('ting', 0.38, 0.13, 'low', function (v, T) {
    var out = v.pan(-0.08), g = v.gain(out);
    perc(g.gain, T, LV.low, 0.001, 0.12);
    v.osc('sine', 2600, T, T + 0.13, g);
    var g2 = v.gain(out);
    perc(g2.gain, T, LV.low * 0.18, 0.001, 0.045);
    v.osc('sine', 2600 * 2.76, T, T + 0.05, g2);
  });

  // 0.48-0.95 ceremony celesta: triangle plus a sine partial at 2x, C5 E5 G5 B5, 400 ms decay each
  ['C5', 'E5', 'G5', 'B5'].forEach(function (n, i) {
    cue('celesta-' + n, 0.48 + 0.12 * i, 0.41, 'med', function (v, T) {
      var f = hz(n), out = v.pan(-0.12 + 0.08 * i);
      var g = v.gain(out);
      perc(g.gain, T, LV.med * 0.62, 0.002, 0.4);
      v.osc('triangle', f, T, T + 0.41, g);
      var g2 = v.gain(out);
      perc(g2.gain, T, LV.med * 0.24, 0.001, 0.24);
      v.osc('sine', 2 * f, T, T + 0.25, g2);
    }, { music: true });
  });
